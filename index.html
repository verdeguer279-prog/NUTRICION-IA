<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titanium v37.0 | FULL EXTENDED</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root { 
            --p: #0f172a; 
            --s: #334155; 
            --a: #2563eb; 
            --pro: #8b5cf6; 
            --car: #0ea5e9; 
            --fat: #f59e0b; 
            --bg: #f8fafc; 
            --c: #ffffff; 
            --ok: #10b981; 
            --bad: #ef4444; 
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--p); 
            padding-bottom: 150px; 
            overflow-x: hidden; 
            user-select: none; 
        }
        
        #loading-screen { 
            position: fixed; 
            inset: 0; 
            background: var(--p); 
            color: white; 
            z-index: 9999; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: opacity 0.3s; 
        }

        .spinner { 
            width: 50px; 
            height: 50px; 
            border: 5px solid rgba(255,255,255,0.1); 
            border-top: 5px solid var(--car); 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin-bottom: 20px; 
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* HEADER */
        .header-wrapper { 
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%); 
            color: white; 
            padding: 15px 15px 50px 15px; 
            border-radius: 0 0 24px 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
        }

        .top-nav-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
        }

        .user-group { 
            display: flex; 
            gap: 10px; 
        }

        .user-pill { 
            width: 44px; 
            height: 44px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 50%; 
            cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.1); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0; 
        }

        .avatar { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            background: var(--car); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 800; 
            border: 2px solid rgba(255,255,255,0.2); 
            font-size: 1.1rem; 
        }
        
        .date-nav { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            flex-grow: 1; 
            justify-content: flex-end; 
        }

        .nav-btn { 
            background: rgba(255,255,255,0.1); 
            border: none; 
            width: 40px; 
            height: 40px; 
            border-radius: 12px; 
            color: white; 
            cursor: pointer; 
        }

        .date-txt { text-align: right; }
        
        #h-day { 
            font-size: 1rem; 
            font-weight: 700; 
            margin: 0; 
            text-transform: capitalize; 
        }
        
        #h-full { 
            font-size: 0.7rem; 
            opacity: 0.7; 
            margin: 0; 
        }

        /* DASHBOARD RINGS */
        .dash { 
            display: grid; 
            grid-template-columns: 110px 1fr; 
            gap: 20px; 
            align-items: center; 
        }

        .ring { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            background: conic-gradient(var(--car) 0deg, rgba(255,255,255,0.05) 0deg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            transition: background 0.3s; 
        }

        .ring.danger { background: conic-gradient(var(--bad) 0deg, rgba(255,255,255,0.05) 0deg); }
        
        .ring-in { 
            width: 90px; 
            height: 90px; 
            background: var(--p); 
            border-radius: 50%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        .val-big { font-size: 1.4rem; font-weight: 800; }
        .lbl-small { font-size: 0.6rem; opacity: 0.7; }
        .val-big.danger { color: var(--bad); }
        .lbl-small.danger { color: var(--bad); opacity: 1; font-weight: 700; }
        
        .macros { display: flex; flex-direction: column; gap: 8px; }
        .m-row { display: flex; flex-direction: column; gap: 4px; }
        .m-head { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; }
        
        .bar-bg { 
            width: 100%; 
            height: 6px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 4px; 
            overflow: hidden; 
        }

        .bar-fill { height: 100%; border-radius: 4px; }

        .bio-alert { 
            margin-top: 20px; 
            padding: 10px; 
            background: rgba(255,255,255,0.05); 
            border-radius: 12px; 
            font-size: 0.8rem; 
            display: flex; 
            justify-content: space-around; 
            border: 1px solid rgba(255,255,255,0.1); 
        }

        /* MAIN CONTENT */
        .main { 
            max-width: 800px; 
            margin: -30px auto 0; 
            padding: 0 15px; 
            position: relative; 
            z-index: 10; 
        }

        .card { 
            background: white; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            overflow: hidden; 
            border: 1px solid #e2e8f0; 
        }
        
        .c-head { 
            padding: 12px 15px; 
            background: #f8fafc; 
            border-bottom: 1px solid #f1f5f9; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 10px; 
        }

        .c-left { font-weight: 800; color: var(--s); font-size: 1rem; display: flex; align-items: center; gap: 8px; }
        .c-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex-grow: 1; }
        
        .meal-macros { 
            display: flex; 
            gap: 8px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            font-family: monospace; 
            background: white; 
            padding: 4px 8px; 
            border-radius: 6px; 
            border: 1px solid #e2e8f0; 
            margin-right: 5px; 
        }

        .mm-item { display: flex; align-items: center; gap: 3px; }
        .mm-dot { width: 6px; height: 6px; border-radius: 50%; }
        
        .k-badge { 
            background: var(--p); 
            color: white; 
            padding: 4px 8px; 
            border-radius: 6px; 
            font-weight: 800; 
            font-size: 0.8rem; 
        }

        .tool-btn { 
            width: 34px; 
            height: 34px; 
            border-radius: 8px; 
            border: 1px solid #cbd5e1; 
            background: white; 
            color: #64748b; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.2s; 
            font-size: 0.9rem; 
        }
        
        .tool-btn:hover { transform: translateY(-2px); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tool-btn.copy { color: var(--a); border-color: var(--a); background: #eff6ff; }
        .tool-btn.move { color: var(--warn); border-color: var(--warn); background: #fffbeb; }
        .tool-btn.del { color: var(--bad); border-color: var(--bad); background: #fef2f2; }
        .tool-btn.add { color: var(--ok); border-color: var(--ok); background: #ecfdf5; font-weight: bold; width: auto; padding: 0 12px; }
        
        .item { 
            padding: 14px 15px; 
            border-bottom: 1px solid #f1f5f9; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .i-info h4 { font-size: 0.95rem; font-weight: 700; color: var(--p); margin-bottom: 4px; }
        .i-det { font-size: 0.8rem; color: #64748b; display: flex; gap: 10px; font-family: monospace; font-weight: 600; align-items: center; }
        .i-pill { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: var(--p); font-family: 'Inter', sans-serif; font-weight: 700; }
        
        .c-actions { display: flex; gap: 8px; }
        
        .act-btn { 
            width: 32px; 
            height: 32px; 
            border: 1px solid #e2e8f0; 
            background: white; 
            border-radius: 8px; 
            color: #94a3b8; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .act-btn:hover { border-color: var(--car); color: var(--car); }
        .act-btn.del:hover { border-color: #ef4444; color: #ef4444; }
        .act-btn.cln:hover { border-color: var(--a); color: var(--a); background: #eff6ff; }

        .fab { 
            position: fixed; 
            bottom: 30px; 
            right: 25px; 
            width: 65px; 
            height: 65px; 
            background: var(--p); 
            color: white; 
            border-radius: 20px; 
            border: none; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            font-size: 1.5rem; 
            cursor: pointer; 
            z-index: 100; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        /* MODALES */
        .modal { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(5px); 
            z-index: 2000; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        .sheet { 
            background: white; 
            width: 100%; 
            max-width: 500px; 
            border-radius: 20px; 
            padding: 25px; 
            max-height: 85vh; 
            overflow-y: auto; 
        }

        .inp { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            background: #f8fafc; 
            margin-bottom: 15px; 
            font-size: 1rem; 
        }

        .btn { 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            border: none; 
            font-weight: 800; 
            font-size: 1rem; 
            cursor: pointer; 
            margin-bottom: 10px; 
        }

        .btn.pri { background: var(--a); color: white; }
        .btn.sec { background: #f1f5f9; color: var(--p); }
        .btn.del-user { background: var(--bad); color: white; margin-top: 20px; }

        .modal-h { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }

        .close-x { 
            font-size: 2rem; 
            background: none; 
            border: none; 
            color: #94a3b8; 
            cursor: pointer; 
            line-height: 1; 
        }

        /* USERS */
        .user-list-grid { display: grid; gap: 12px; }
        .user-card-wrapper { 
            display: flex; 
            align-items: center; 
            background: white; 
            border: 1px solid #e2e8f0; 
            border-radius: 14px; 
            padding: 12px; 
            transition: all 0.2s; 
            cursor: pointer; 
        }
        .user-card-wrapper:hover { border-color: var(--a); background: #eff6ff; }
        .user-card-wrapper.active { border-color: var(--a); background: #f0f9ff; box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
        
        .u-av { width: 45px; height: 45px; background: var(--car); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; margin-right: 15px; flex-shrink: 0; font-size: 1.1rem; }
        .u-inf { flex-grow: 1; }
        .u-inf h4 { margin: 0; font-size: 1rem; color: var(--p); }
        .u-inf small { color: #64748b; font-size: 0.8rem; }
        .u-edt { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #94a3b8; border-radius: 8px; }
        .u-edt:hover { background: #e2e8f0; color: var(--a); }

        .live-box { 
            background: #f0f9ff; 
            padding: 12px; 
            border-radius: 14px; 
            border: 1px solid #bae6fd; 
            margin-bottom: 15px; 
            font-size: 0.85rem; 
            display: flex; 
            justify-content: space-between; 
            gap: 5px; 
            flex-wrap: wrap; 
        }
        .stat-item { text-align: center; flex: 1; }
        .stat-val { font-weight: 800; color: var(--a); display: block; }
        .stat-lbl { font-size: 0.7rem; color: #64748b; }

        /* SEARCH */
        .food-suggestion { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px; 
            border-bottom: 1px solid #f1f5f9; 
            cursor: pointer; 
        }
        .food-suggestion:hover { background: #f8fafc; }
        .s-info { flex-grow: 1; }
        .s-del { color: #cbd5e1; padding: 5px 10px; cursor: pointer; transition: 0.2s; }
        .s-del:hover { color: var(--bad); }

        .unit-selector { padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; font-weight: 700; color: var(--text-dark); cursor: pointer; }

        /* AI AREA */
        .ai-header-btn { 
            font-size: 0.8rem; 
            background: #f1f5f9; 
            color: #64748b; 
            border: 1px solid #cbd5e1; 
            padding: 6px 12px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            margin-left: 10px; 
            transition: all 0.3s; 
        }
        .ai-header-btn.configured { background: #ecfdf5; color: var(--ok); border-color: var(--ok); }
        
        .ai-input-area { margin-bottom: 20px; }
        .ai-textarea { 
            width: 100%; 
            height: 100px; 
            padding: 15px; 
            border: 1px solid #e2e8f0; 
            border-radius: 14px; 
            font-family: inherit; 
            font-size: 1rem; 
            resize: none; 
            background: #f8fafc; 
            margin-bottom: 10px; 
        }
        .ai-textarea:focus { border-color: var(--a); background: white; }
        .ai-actions { display: flex; gap: 10px; align-items: center; }
        
        .mic-btn { width: 50px; height: 50px; background: #ef4444; color: white; border: none; border-radius: 14px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .mic-btn.listening { animation: pulse 1s infinite; background: #dc2626; }
        .cam-btn { width: 50px; height: 50px; background: #3b82f6; color: white; border: none; border-radius: 14px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }
        .password-wrapper { position: relative; }
        .eye-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; }
        
        .separator { text-align: center; margin: 20px 0; color: #94a3b8; font-size: 0.8rem; position: relative; }
        .separator::before, .separator::after { content: ''; position: absolute; top: 50%; width: 45%; height: 1px; background: #e2e8f0; }
        .separator::before { left: 0; } .separator::after { right: 0; }
        
        .link-btn { background: none; border: none; color: var(--a); cursor: pointer; text-decoration: underline; font-size: 0.85rem; display: block; margin: 10px auto; }
        .api-link { display: block; text-align: center; font-size: 0.8rem; color: var(--a); margin-top: 10px; text-decoration: none; border: 1px dashed var(--a); padding: 8px; border-radius: 8px; }

        /* ESTADÍSTICAS */
        .chart-filters { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .filter-btn { padding: 8px 16px; border: 1px solid #cbd5e1; background: white; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
        .filter-btn.active { background: var(--p); color: white; border-color: var(--p); }
        
        .weight-input-box { display: flex; gap: 10px; margin-bottom: 10px; background: #f0f9ff; padding: 15px; border-radius: 12px; align-items: center; flex-wrap: wrap;}
        .weight-input-box input { margin: 0; flex: 1; }
        .weight-input-box button { width: auto; margin: 0; padding: 0 20px; }
        .weight-date { width: 100%; border-bottom: 1px solid #dbeafe; padding-bottom: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; color: #64748b; font-size: 0.9rem; }
        
        .w-delta { font-size: 0.8rem; width: 100%; display: flex; justify-content: space-between; color: #64748b; margin-top: 5px; }
        .w-delta span b { color: var(--p); }
        
        .text-ok { color: var(--ok); font-weight: bold; }
        .text-bad { color: var(--bad); font-weight: bold; }
        
        .day-stepper { display:flex; gap:5px; align-items:center; }
        .day-btn { background:#e2e8f0; border:none; border-radius:5px; width:30px; height:30px; cursor:pointer; }
        
        .rings-container { display: flex; justify-content: space-around; gap: 10px; margin-bottom: 20px; }
        .stat-ring-wrap { position: relative; width: 140px; height: 140px; display: flex; justify-content: center; align-items: center; }
        .stat-ring-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
        
        .srt-val { font-size: 1.1rem; font-weight: 800; color: var(--p); display: block; }
        .srt-lbl { color: #64748b; font-size: 0.7rem; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="spinner"></div></div>

    <header class="header-wrapper" id="pdf-header">
        <div class="top-nav-bar">
            <div class="user-group">
                <div class="user-pill" onclick="window.App.UI.openUsers()" title="Cambiar Usuario">
                    <div class="avatar" id="h-av">?</div>
                </div>
                <div class="user-pill" onclick="window.App.Stats.open()" style="background:white; color:var(--p)" title="Estadísticas">
                    <i class="fas fa-chart-pie"></i>
                </div>
            </div>
            <div class="date-nav">
                <button class="nav-btn" onclick="window.App.Logic.day(-1)"><i class="fas fa-arrow-left"></i></button>
                <div class="date-txt">
                    <h2 id="h-day">...</h2>
                    <p id="h-full">...</p>
                </div>
                <button class="nav-btn" onclick="window.App.Logic.day(1)"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>

        <div class="dash">
            <div class="ring" id="ring-bg">
                <div class="ring-in">
                    <span class="lbl-small" id="l-restan">RESTAN</span>
                    <span class="val-big" id="v-rem">0</span>
                </div>
            </div>
            <div class="macros">
                <div class="m-row">
                    <div class="m-head"><span style="color:var(--pro)">PROTEÍNAS</span><span id="v-p">0/0</span></div>
                    <div class="bar-bg"><div class="bar-fill" id="b-p" style="background:var(--pro); width:0%"></div></div>
                </div>
                <div class="m-row">
                    <div class="m-head"><span style="color:var(--car)">CARBOHIDRATOS</span><span id="v-c">0/0</span></div>
                    <div class="bar-bg"><div class="bar-fill" id="b-c" style="background:var(--car); width:0%"></div></div>
                </div>
                <div class="m-row">
                    <div class="m-head"><span style="color:var(--fat)">GRASAS</span><span id="v-f">0/0</span></div>
                    <div class="bar-bg"><div class="bar-fill" id="b-f" style="background:var(--fat); width:0%"></div></div>
                </div>
            </div>
        </div>
        <div class="bio-alert" id="bio-txt">...</div>
    </header>

    <main class="main" id="feed"></main>

    <button class="fab" onclick="document.getElementById('m-glob').style.display='flex'"><i class="fas fa-bolt"></i></button>

    <div class="modal" id="m-stats">
        <div class="sheet" style="max-width:600px">
            <div class="modal-h">
                <h3>Estadísticas</h3>
                <div class="day-stepper">
                    <button class="day-btn" onclick="window.App.Stats.changeDate(-1)"><</button>
                    <input type="date" id="st-date" style="border:none;background:transparent;font-weight:bold" onchange="window.App.Stats.load(this.value)">
                    <button class="day-btn" onclick="window.App.Stats.changeDate(1)">></button>
                </div>
                <button class="close-x" onclick="window.App.UI.closeAll()">&times;</button>
            </div>
            
            <div class="weight-input-box">
                <input type="text" id="w-today" class="inp" placeholder="Peso (kg)" inputmode="decimal">
                <button class="btn pri" onclick="window.App.Stats.saveWeight()">Guardar</button>
                <div class="w-delta" id="w-feedback"></div>
            </div>

            <div class="rings-container">
                <div>
                    <h4 style="text-align:center;font-size:0.8rem">DIARIO</h4>
                    <div class="stat-ring-wrap">
                        <canvas id="chart-daily"></canvas>
                        <div class="stat-ring-text" id="daily-txt"></div>
                    </div>
                </div>
                <div>
                    <h4 style="text-align:center;font-size:0.8rem">SEMANAL</h4>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs, updateDoc, deleteDoc, writeBatch, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmiDfja_EDSK31fjxBmMxumWvYryYurHU",
            authDomain: "nutricion-f6e70.firebaseapp.com",
            projectId: "nutricion-f6e70",
            storageBucket: "nutricion-f6e70.firebasestorage.app",
            messagingSenderId: "926932712073",
            appId: "1:926932712073:web:d660418820d91ec4ec6458",
            measurementId: "G-MFB78MVX9S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const fire = { doc, setDoc, getDoc, collection, getDocs, updateDoc, deleteDoc, writeBatch, query, where, orderBy, limit };
        
        const MEALS = [
            {k:'01_desayuno',n:'Desayuno',i:'fa-coffee'},
            {k:'02_almuerzo',n:'Almuerzo',i:'fa-bread-slice'},
            {k:'03_comida',n:'Comida',i:'fa-utensils'},
            {k:'04_merienda',n:'Merienda',i:'fa-apple-alt'},
            {k:'05_cena',n:'Cena',i:'fa-moon'}
        ];
        
        // --- NÚCLEO GLOBAL (ESTRUCTURA SEGURA) ---
        window.App = {
            S: { d: new Date(), uid: localStorage.getItem('tid'), u: null, day: {}, lib: [], allUsers: [], tm: null, item: null, edit: false, eIdx: null, srcMeal: null, copyMode: 'copy', srcIdx: null },
            
            DB: {
                col: (n) => fire.collection(db, n),
                doc: (p,i) => fire.doc(db, p, i),
                norm: (u) => ({ id: u.id, name: u.name||'Usuario', h: parseFloat(u.height||170), w: parseFloat(u.weight||70), y: parseInt(u.birthYear||1990), g: u.gender||'male', act: u.activity||"1.2", mod: u.goalMod||"0", mac: u.customMacros || {p:null, c:null, f:null} }),
                getUsers: async () => { const s=await fire.getDocs(App.DB.col('usuarios')); return App.S.allUsers=s.docs.map(d=>App.DB.norm(d.data())); },
                getU: async(id) => { const s=await fire.getDoc(App.DB.doc('usuarios', id)); return s.exists()?s.data():null; },
                setU: async(u) => await fire.setDoc(App.DB.doc('usuarios', u.id), u),
                delU: async(id) => await fire.deleteDoc(App.DB.doc('usuarios', id)),
                getDay: async(d) => { const k=d.toISOString().split('T')[0]; const s=await fire.getDoc(App.DB.doc('usuarios/'+App.S.uid+'/diario', k)); let data=s.exists()?s.data():{}; MEALS.forEach(m=>{ if(!data[m.k]) data[m.k]=[] }); return data; },
                getDayLog: async (uid, dStr) => { const s=await fire.getDoc(App.DB.doc('usuarios/'+uid+'/diario', dStr)); return s.exists()?s.data():{}; },
                setDay: async() => { const k=App.S.d.toISOString().split('T')[0]; await fire.setDoc(App.DB.doc('usuarios/'+App.S.uid+'/diario', k), App.S.day); },
                lib: async() => { const s=await fire.getDoc(App.DB.doc('sistema','biblioteca')); App.S.lib=s.exists()?s.data().items:[]; },
                addLib: async(arr) => { arr.forEach(n=>{ if(!App.S.lib.find(x=>x.n===n.n)) App.S.lib.push(n); }); await fire.setDoc(App.DB.doc('sistema','biblioteca'), {items: App.S.lib}); }
            },

            Logic: {
                day: (n) => { App.S.d.setDate(App.S.d.getDate()+n); App.Sys.sync(); },
                saveUser: async () => {
                    const n = document.getElementById('e-name').value;
                    if(!n) return alert("Nombre obligatorio");
                    const v = (id) => document.getElementById(id).value;
                    const bmr = (10*v('e-w'))+(6.25*v('e-h'))-(5*(new Date().getFullYear()-v('e-y')))+(v('e-g')=='male'?5:-161);
                    const goal = Math.round(bmr*v('e-act') + parseInt(v('e-mod')));
                    const u = { id: App.S.u?App.S.u.id : n.toLowerCase().replace(/\s/g,'_'), name:n, height:v('e-h'), weight:v('e-w'), birthYear:v('e-y'), gender:v('e-g'), activity:v('e-act'), goalMod:v('e-mod'), customMacros: { p:Math.round(goal*(v('pp')/100)/4), c:Math.round(goal*(v('pc')/100)/4), f:Math.round(goal*(v('pf')/100)/9) } };
                    await App.DB.setU(u); alert("Guardado"); App.S.allUsers=await App.DB.getUsers(); await App.Sys.load(u.id); App.UI.closeAll();
                },
                saveWeight: async () => {
                    const w = parseFloat(document.getElementById('w-today').value.replace(',','.'));
                    const d = document.getElementById('st-date').value;
                    if(!w || !d) return alert("Faltan datos");
                    const ref = fire.doc(db, `usuarios/${App.S.uid}/diario`, d);
                    const snap = await fire.getDoc(ref);
                    let data = snap.exists() ? snap.data() : {};
                    data.weight = w;
                    await fire.setDoc(ref, data);
                    if(d === App.S.d.toISOString().split('T')[0]) App.S.day.weight = w;
                    alert("Peso guardado"); App.Stats.load(d);
                },
                checkWeight: () => { if(!App.S.day.weight) setTimeout(() => { if(confirm("¿Registrar peso hoy?")) App.Stats.open(); }, 1000); },
                deleteUser: async () => { if(confirm("¿Eliminar usuario?")) { await App.DB.delU(App.S.u.id); localStorage.removeItem('tid'); location.reload(); } },
                delFromLib: async (n) => { if(confirm("¿Borrar?")) { App.S.lib=App.S.lib.filter(x=>x.n!==n); await fire.setDoc(App.DB.doc('sistema','biblioteca'), {items: App.S.lib}); App.Logic.search(); } },
                openAdd: (mk) => { App.S.tm=mk; App.S.edit=false; App.UI.view('v-home'); App.UI.open('m-add'); if(App.S.lib.length>0) App.Logic.search(); App.UI.checkAI(); },
                openImport: () => { document.getElementById('imp-date').valueAsDate = new Date(); App.UI.view('v-import'); },
                search: () => {
                    const q = document.getElementById('src-in').value.toLowerCase();
                    const b = document.getElementById('res-list'); b.innerHTML='';
                    App.S.lib.filter(x => x.n.toLowerCase().includes(q)).forEach(f => {
                        const d = document.createElement('div'); d.className='food-suggestion';
                        d.innerHTML = `<div class="s-info"><b>${f.n}</b> <small>${Math.round(f.k)} kcal/100${f.u}</small></div><div class="s-del"><i class="fas fa-trash-alt"></i></div>`;
                        // ARREGLO CLICK BUSCADOR
                        d.querySelector('.s-info').onclick = () => { 
                            window.tempItem = JSON.parse(JSON.stringify(f)); 
                            App.UI.setQty(window.tempItem); 
                            App.UI.view('v-qty'); 
                        };
                        d.querySelector('.s-del').onclick = () => App.Logic.delFromLib(f.n);
                        b.appendChild(d);
                    });
                },
                saveItem: async () => {
                    const q = parseFloat(document.getElementById('qty-in').value); 
                    const u = document.getElementById('unit-in').value;
                    const base = window.tempItem || App.S.item; 
                    let bk=base.k, bp=base.p, bc=base.c, bf=base.f;
                    // FIX EDIT SCALING
                    if(App.S.edit) { const f = base.q/100; bk/=f; bp/=f; bc/=f; bf/=f; }
                    const fac = q/100;
                    const entry = { n:base.n, q:q, u:u, k:bk*fac, p:bp*fac, c:bc*fac, f:bf*fac };
                    if(App.S.edit) App.S.day[App.S.tm][App.S.eIdx] = entry; else App.S.day[App.S.tm].push(entry);
                    await App.DB.setDay(); App.UI.closeAll(); App.Sys.sync();
                },
                editItem: (mk, idx) => { App.S.edit=true; App.S.tm=mk; App.S.eIdx=idx; App.S.item = JSON.parse(JSON.stringify(App.S.day[mk][idx])); window.tempItem=App.S.item; App.UI.setQty(App.S.item); App.UI.view('v-qty'); App.UI.open('m-add'); },
                delItem: async (mk, idx) => { if(confirm("¿Borrar?")) { App.S.day[mk].splice(idx,1); await App.DB.setDay(); App.Sys.sync(); } },
                wipeMeal: async (mk) => { if(confirm("¿Vaciar?")) { App.S.day[mk]=[]; await App.DB.setDay(); App.Sys.sync(); } },
                wipe: async () => { if(confirm("¿Borrar día?")) { App.S.day={}; MEALS.forEach(m=>App.S.day[m.k]=[]); await App.DB.setDay(); App.Sys.sync(); App.UI.closeAll(); } },
                
                openCopy: (mk, type, itemIdx = null) => { 
                    App.S.srcMeal=mk; App.S.copyMode=type; App.S.srcIdx = itemIdx; 
                    document.getElementById('copy-ti').innerText = itemIdx!==null ? (type==='move'?'Mover Alimento':'Copiar Alimento') : (type==='move'?'Mover Comida':'Copiar Comida');
                    document.getElementById('copy-date').valueAsDate=App.S.d; document.getElementById('copy-meal').value=mk; App.UI.open('m-copy'); 
                },
                
                execCopy: async () => {
                    const d = document.getElementById('copy-date').value; 
                    const tm = document.getElementById('copy-meal').value;
                    const ref = fire.doc(db, `usuarios/${App.S.uid}/diario`, d); 
                    const snap = await fire.getDoc(ref);
                    let data = snap.exists() ? snap.data() : {}; if(!data[tm]) data[tm] = [];
                    
                    // LÓGICA MOVIMIENTO UNITARIO
                    if(App.S.srcIdx !== null) { 
                        const item = JSON.parse(JSON.stringify(App.S.day[App.S.srcMeal][App.S.srcIdx]));
                        data[tm].push(item); 
                        if(App.S.copyMode === 'move') App.S.day[App.S.srcMeal].splice(App.S.srcIdx, 1); 
                    } else { 
                        data[tm] = data[tm].concat(JSON.parse(JSON.stringify(App.S.day[App.S.srcMeal]))); 
                        if(App.S.copyMode === 'move') App.S.day[App.S.srcMeal] = []; 
                    }
                    
                    await fire.setDoc(ref, data); 
                    if(App.S.copyMode === 'move') await App.DB.setDay();
                    App.UI.closeAll(); 
                    if(d===App.S.d.toISOString().split('T')[0]) App.Sys.sync(); 
                    alert("Hecho");
                },
                execImport: async () => {
                    const d = document.getElementById('imp-date').value; const meal = document.getElementById('imp-meal').value;
                    const snap = await fire.getDoc(fire.doc(db, `usuarios/${App.S.uid}/diario`, d));
                    if(snap.exists() && snap.data()[meal]) { App.S.day[App.S.tm] = App.S.day[App.S.tm].concat(snap.data()[meal]); await App.DB.setDay(); App.UI.closeAll(); App.Sys.sync(); alert("Importado"); }
                    else { alert("Sin datos"); }
                },
                parse: async () => {
                    try {
                        const txt = document.getElementById('json-in').value;
                        // REGEX BLINDADA PARA IA
                        const match = txt.match(/\[[\s\S]*\]/) || txt.match(/\{[\s\S]*\}/);
                        if(!match) throw new Error("No se encontró JSON válido en el texto");
                        const json = JSON.parse(match[0]);
                        
                        let items = Array.isArray(json)?json:(json.comida_combinada?json.comida_combinada.items:(json.items||json.detalles||[json]));
                        const newItems = [];
                        items.forEach(it => {
                            let q=100, u="g";
                            if(it.cantidad) { if(typeof it.cantidad==='string'){ const p=it.cantidad.trim().split(/\s+/); q=parseFloat(p[0])||100; if(p[1])u=p[1].toLowerCase(); } else q=parseFloat(it.cantidad)||100; }
                            const fac=q/100; const get=(keys)=>{ for(let k of keys) { if(it[k]!=undefined)return parseFloat(it[k]); if(it.macros&&it.macros[k]!=undefined)return parseFloat(it.macros[k]); } return 0; };
                            const base = { n: it.producto||it.nombre||it.n||"Item", q:100, u:u, k: get(['energia_kcal','kcal','k'])/fac, p: get(['proteinas_g','p','prot'])/fac, c: get(['hidratos_carbono_g','c','hc'])/fac, f: get(['grasas_g','f','fat'])/fac };
                            App.S.day[App.S.tm].push({...base, q:q, k:base.k*fac, p:base.p*fac, c:base.c*fac, f:base.f*fac}); newItems.push(base);
                        });
                        await App.DB.setDay(); await App.DB.addLib(newItems); document.getElementById('json-in').value=''; App.UI.closeAll(); App.Sys.sync();
                    } catch(e) { alert("Error leyendo JSON: " + e.message); }
                },
                pdf: () => { window.UI.closeAll(); html2pdf().from(document.body).save(); },
                pdfHistory: async () => {
                    const btn = document.querySelector('#m-glob button:nth-child(2)'); btn.innerText = "Generando...";
                    try {
                        const snap = await fire.getDocs(query(fire.collection(db, `usuarios/${App.S.uid}/diario`), orderBy('__name__')));
                        let html = `<div style="padding:20px;font-family:sans-serif"><h1>Historial ${App.S.u.name}</h1>`;
                        snap.forEach(doc => {
                            const data = doc.data(); let totalK = 0; let mealsHtml = '';
                            MEALS.forEach(m => { if(data[m.k] && data[m.k].length) { mealsHtml += `<b>${m.n}:</b> `; data[m.k].forEach(i => { totalK += i.k; mealsHtml += `${i.n} (${Math.round(i.k)}), `; }); mealsHtml += '<br>'; } });
                            if(totalK > 0) html += `<div style="border-bottom:1px solid #ccc;padding:10px"><strong>${doc.id}</strong> Total: ${Math.round(totalK)}<br>${mealsHtml}</div>`;
                        });
                        html += `</div>`; const el = document.createElement('div'); el.innerHTML = html; document.body.appendChild(el);
                        html2pdf().from(el).save(); setTimeout(() => el.remove(), 2000);
                    } catch(e) { alert(e.message); } finally { btn.innerText = "📚 PDF Historial"; App.UI.closeAll(); }
                },
                exportJSON: async () => { const snap = await fire.getDocs(fire.collection(db, `usuarios/${App.S.uid}/diario`)); const data = { perfil: App.S.u, historial: {} }; snap.forEach(d => data.historial[d.id] = d.data()); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'})); a.download = `Backup_${App.S.u.name}.json`; a.click(); },
                importJSON: async (input) => {
                    const file = input.files[0]; if(!file) return;
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try { const data = JSON.parse(e.target.result); if(!confirm("¿Importar?")) return; const batch = fire.writeBatch(db); Object.entries(data.historial).forEach(([d, v]) => batch.set(fire.doc(db, `usuarios/${App.S.uid}/diario`, d), v)); await batch.commit(); location.reload(); } catch(err) { alert(err.message); }
                    }; reader.readAsText(file);
                },
                syncHistory: async () => {
                    const btn = document.querySelector('#m-glob button:nth-child(5)'); btn.innerText = "Sincronizando...";
                    try {
                        const snap = await fire.getDocs(fire.collection(db, `usuarios/${App.S.uid}/diario`)); let count = 0;
                        snap.forEach(doc => { const d = doc.data(); Object.values(d).forEach(m => { if(Array.isArray(m)) m.forEach(i => { if(!App.S.lib.find(x => x.n === i.n)) { let q=parseFloat(i.q)||100, f=q/100||1; App.S.lib.push({ n:i.n, u:i.u||'g', q:100, k:(i.k||0)/f, p:(i.p||0)/f, c:(i.c||0)/f, f:(i.f||0)/f }); count++; } }); }); });
                        if(count > 0) { await fire.setDoc(App.DB.doc('sistema','biblioteca'), {items: App.S.lib}); alert(`Recuperados: ${count}`); } else alert("Al día");
                    } catch(e) { alert(e.message); } finally { btn.innerText = "📚 Sincronizar Historial"; }
                }
            },

            AI: {
                saveConfig: () => { localStorage.setItem('titan_ai_key', document.getElementById('ai-key').value); localStorage.setItem('titan_ai_model', document.getElementById('ai-model').value); App.UI.view('v-home'); App.UI.checkAI(); },
                toggleEye: () => { const x = document.getElementById('ai-key'); x.type = x.type==='password'?'text':'password'; },
                listen: () => { const r = new window.webkitSpeechRecognition(); r.lang='es-ES'; const b=document.querySelector('.mic-btn'); b.classList.add('listening'); r.onresult=(e)=>{document.getElementById('ai-text').value+=e.results[0][0].transcript;b.classList.remove('listening')}; r.start(); },
                handleImage: (i) => { const f=i.files[0]; const r=new FileReader(); r.onload=(e)=>{window.App.AI.img=e.target.result.split(',')[1]; window.App.AI.mime=f.type; document.getElementById('ai-img-preview').innerText="Imagen OK"; }; r.readAsDataURL(f); },
                process: async () => {
                    const k=localStorage.getItem('titan_ai_key'); if(!k) return App.UI.view('v-conf');
                    const btn=document.querySelector('#v-home .btn.pri'); const old=btn.innerText; btn.innerText="Thinking...";
                    try {
                        const body = { contents: [{ parts: [] }] };
                        const txt = document.getElementById('ai-text').value;
                        if(txt) body.contents[0].parts.push({text: `Analiza: "${txt}". JSON ARRAY: [{"n":"Nombre","q":cantidad,"u":"g"|"ml","k":kcal,"p":prot,"c":carb,"f":grasa}]. 100g default.`});
                        if(window.App.AI.img) body.contents[0].parts.push({inlineData: {mimeType: window.App.AI.mime, data: window.App.AI.img}});
                        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
                        const d = await r.json();
                        const raw = d.candidates[0].content.parts[0].text;
                        const match = raw.match(/\[[\s\S]*\]/); // REGEX FIX
                        if(!match) throw new Error("No JSON found");
                        const items = JSON.parse(match[0]);
                        const mapped = items.map(i => ({ n:i.n, q:i.q, u:i.u, k:i.k, p:i.p, c:i.c, f:i.f }));
                        App.S.day[App.S.tm] = App.S.day[App.S.tm].concat(mapped); await App.DB.setDay();
                        const lib = mapped.map(i => { const f = i.q/100; return { n:i.n, q:100, u:i.u, k:i.k/f, p:i.p/f, c:i.c/f, f:i.f/f }; });
                        await App.DB.addLib(lib); App.UI.closeAll(); App.Sys.sync();
                    } catch(e) { alert("Error IA: "+e.message); } finally { btn.innerText=old; }
                }
            },

            UI: {
                open: (id) => document.getElementById(id).style.display='flex',
                closeAll: () => document.querySelectorAll('.modal').forEach(m=>m.style.display='none'),
                view: (id) => { ['v-home','v-conf','v-qty','v-json','v-import'].forEach(x=>document.getElementById(x).style.display='none'); document.getElementById(id).style.display='block'; },
                checkAI: () => { const k=localStorage.getItem('titan_ai_key'); const b=document.getElementById('btn-config-ai'); if(k) b.classList.add('configured'); document.getElementById('ai-key').value=k||''; },
                setQty: (i) => { document.getElementById('qty-name').innerText=i.n; document.getElementById('qty-in').value=i.q; document.getElementById('unit-in').value=i.u; },
                openUsers: async () => { const l=document.getElementById('u-list'); l.innerHTML='...'; const us=await App.DB.getUsers(); l.innerHTML=''; us.forEach(u=>{ const d=document.createElement('div'); d.className=`user-card-wrapper ${App.S.u&&App.S.u.id===u.id?'active':''}`; d.innerHTML=`<div class="u-av" onclick="window.App.Sys.load('${u.id}')">${u.name[0]}</div><div class="u-inf" onclick="window.App.Sys.load('${u.id}')"><h4>${u.name}</h4></div><div class="u-edt" onclick="window.App.UI.editUser('${u.id}')">✎</div>`; l.appendChild(d); }); App.UI.open('m-users'); },
                editUser: (id) => { const u=App.S.allUsers.find(x=>x.id===id); document.getElementById('e-name').value=u.name; document.getElementById('e-h').value=u.h; document.getElementById('e-w').value=u.w; document.getElementById('e-y').value=u.y; document.getElementById('e-act').value=u.act; document.getElementById('e-mod').value=u.mod; if(u.mac.p){ const bm=(10*u.w)+(6.25*u.h)-(5*(new Date().getFullYear()-u.y))+(u.g=='male'?5:-161); const g=Math.round(bm*u.act+parseInt(u.mod)); document.getElementById('pp').value=Math.round((u.mac.p*4/g)*100); document.getElementById('pc').value=Math.round((u.mac.c*4/g)*100); document.getElementById('pf').value=Math.round((u.mac.f*9/g)*100); } document.getElementById('btn-del-user').style.display='block'; App.Calc.live(); App.UI.open('m-prof'); },
                newProfile: () => { App.S.u=null; document.querySelectorAll('#m-prof input').forEach(i=>i.value=''); App.UI.open('m-prof'); App.Calc.live(); }
            },

            Calc: {
                bio: () => { if(!App.S.u) return; const h=App.S.u.h, w=App.S.u.w, a=new Date().getFullYear()-App.S.u.y; const bm=(10*w)+(6.25*h)-(5*a)+(App.S.u.g=='male'?5:-161); const td=bm*parseFloat(App.S.u.act); const g=Math.round(td+parseInt(App.S.u.mod)); App.S.u.calc={goal:g, tdee:td}; if(App.S.u.mac.p){App.S.u.calc.p=App.S.u.mac.p;App.S.u.calc.c=App.S.u.mac.c;App.S.u.calc.f=App.S.u.mac.f} else {App.S.u.calc.p=Math.round(w*2);App.S.u.calc.f=Math.round(w*0.9);App.S.u.calc.c=Math.round((g-(App.S.u.calc.p*4)-(App.S.u.calc.f*9))/4)} document.getElementById('h-av').innerText=App.S.u.name[0]; document.getElementById('bio-txt').innerText=`Meta: ${g} kcal`; },
                live: () => { const v=(i)=>parseFloat(document.getElementById(i).value)||0; const bm=(10*v('e-w'))+(6.25*v('e-h'))-(5*(new Date().getFullYear()-v('e-y')))+(document.getElementById('e-g').value=='male'?5:-161); const g=Math.round(bm*v('e-act')+v('e-mod')); document.getElementById('l-tmb').innerText=Math.round(bm); document.getElementById('l-goal').innerText=g; }
            },

            Stats: {
                chartDaily: null, chartWeekly: null, chartWeight: null, chartInstance:null, weightInstance:null, currentDate: new Date(),
                open: () => { App.Stats.currentDate = new Date(); App.UI.open('m-stats'); App.Stats.updateView(); },
                changeDate: (delta) => { App.Stats.currentDate.setDate(App.Stats.currentDate.getDate() + delta); App.Stats.updateView(); },
                load: (dStr) => { if(dStr) App.Stats.currentDate = new Date(dStr); App.Stats.updateView(); },
                saveWeight: async () => {
                    let val = document.getElementById('w-today').value.replace(',','.'); const w = parseFloat(val);
                    const dStr = App.Stats.currentDate.toISOString().split('T')[0];
                    if(!w) return alert("Falta peso");
                    const ref = fire.doc(db, `usuarios/${App.S.uid}/diario`, dStr); const snap = await fire.getDoc(ref);
                    let data = snap.exists() ? snap.data() : {}; data.weight = w; await fire.setDoc(ref, data);
                    if(dStr === App.S.d.toISOString().split('T')[0]) App.S.day.weight = w;
                    alert("Guardado"); App.Stats.updateView();
                },
                updateView: async () => {
                    const dateStr = App.Stats.currentDate.toISOString().split('T')[0]; document.getElementById('st-date').value = dateStr;
                    const allDocs = await fire.getDocs(query(fire.collection(db, `usuarios/${App.S.uid}/diario`), orderBy('__name__')));
                    const history = []; allDocs.forEach(d => history.push({id: d.id, ...d.data()}));
                    
                    let firstW=null, prevW=null, currW=null;
                    for(let h of history) { if(h.weight) { firstW=h.weight; break; } }
                    for(let h of history) { if(h.id === dateStr) currW=h.weight; if(h.id < dateStr && h.weight) prevW=h.weight; }
                    
                    document.getElementById('w-today').value = currW || '';
                    const fmtDiff = (c, b) => { const diff = c - b; const cl = diff > 0 ? 'text-bad' : 'text-ok'; return `<b class="${cl}">${diff > 0 ? '+' : ''}${diff.toFixed(1)}kg</b>`; };
                    let html = '';
                    if(currW) { if(prevW) html += `<span>vs Ant (${prevW}): ${fmtDiff(currW, prevW)}</span>`; if(firstW) html += `<span>vs Inicio (${firstW}): ${fmtDiff(currW, firstW)}</span>`; }
                    document.getElementById('w-feedback').innerHTML = html;

                    // DAILY
                    let dCal=0, dGoal=App.S.u.calc.goal, dDat=history.find(h=>h.id===dateStr);
                    if(dDat) MEALS.forEach(m=>{if(dDat[m.k]) dDat[m.k].forEach(i=>dCal+=i.k)});
                    const diffD = dCal - dGoal;
                    if(App.Stats.chartDaily) App.Stats.chartDaily.destroy();
                    App.Stats.chartDaily = new Chart(document.getElementById('chart-daily'), { type: 'doughnut', data: { datasets: [{ data: diffD > 0 ? [dGoal, diffD] : [dCal, dGoal - dCal], backgroundColor: diffD > 0 ? ['#3b82f6', '#ef4444'] : ['#3b82f6', '#e2e8f0'], borderWidth: 0 }] }, options: { cutout: '75%', plugins: { legend: false } } });
                    document.getElementById('daily-txt').innerHTML = `<span class="srt-val">${Math.round(dCal)}</span><div class="${diffD>0?'text-bad':'text-ok'}">${diffD>0?'+':''}${Math.round(diffD)}</div>`;

                    // WEEKLY
                    const dObj=new Date(App.Stats.currentDate); dObj.setDate(dObj.getDate()-(dObj.getDay()||7)+1);
                    let wCal=0, wGoal=dGoal*7;
                    for(let i=0;i<7;i++){ const t=new Date(dObj); t.setDate(dObj.getDate()+i); const k=t.toISOString().split('T')[0]; const h=history.find(x=>x.id===k); if(h) MEALS.forEach(m=>{if(h[m.k]) h[m.k].forEach(x=>wCal+=x.k)}); }
                    const diffW = wCal - wGoal;
                    if(App.Stats.chartWeekly) App.Stats.chartWeekly.destroy();
                    App.Stats.chartWeekly = new Chart(document.getElementById('chart-weekly'), { type: 'doughnut', data: { datasets: [{ data: diffW > 0 ? [wGoal, diffW] : [wCal, wGoal - wCal], backgroundColor: diffW > 0 ? ['#3b82f6', '#ef4444'] : ['#3b82f6', '#10b981'], borderWidth: 0 }] }, options: { cutout: '75%', plugins: { legend: false } } });
                    document.getElementById('weekly-txt').innerHTML = `<span class="srt-val">${Math.round(wCal)}</span><div class="${diffW>0?'text-bad':'text-ok'}">${diffW>0?'+':''}${Math.round(diffW)}</div>`;

                    // CHARTS
                    const dts=[], cS=[], cE=[], wts=[];
                    for(let i=29;i>=0;i--){
                        const t=new Date(App.Stats.currentDate); t.setDate(t.getDate()-i); const k=t.toISOString().split('T')[0]; dts.push(k.slice(5)); const h=history.find(x=>x.id===k);
                        let dc=0; if(h) MEALS.forEach(m=>{if(h[m.k]) h[m.k].forEach(x=>dc+=x.k)});
                        if(dc>dGoal){cS.push(dGoal); cE.push(dc-dGoal)} else {cS.push(dc); cE.push(0)}
                        wts.push(h?h.weight:null);
                    }
                    if(App.Stats.chartInstance) App.Stats.chartInstance.destroy();
                    App.Stats.chartInstance = new Chart(document.getElementById('chart-cal').getContext('2d'), { type: 'bar', data: { labels:dts, datasets:[{label:'Exceso',data:cE,backgroundColor:'#ef4444',stack:'0'},{label:'Base',data:cS,backgroundColor:'#3b82f6',stack:'0'}]}, options:{maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true}}}});
                    if(App.Stats.weightInstance) App.Stats.weightInstance.destroy();
                    App.Stats.weightInstance = new Chart(document.getElementById('chart-weight').getContext('2d'), { type: 'line', data: { labels:dts, datasets:[{label:'Peso',data:wts,borderColor:'#10b981',tension:0.3,spanGaps:true}]}, options:{maintainAspectRatio:false}});
                }
            },

            Render: {
                all: () => {
                    document.getElementById('h-day').innerText = App.S.d.toLocaleDateString('es-ES',{weekday:'long'});
                    let t={k:0,p:0,c:0,f:0}; Object.values(App.S.day).forEach(arr=>{if(Array.isArray(arr)) arr.forEach(i=>{t.k+=i.k;t.p+=i.p;t.c+=i.c;t.f+=i.f})});
                    const g = App.S.u.calc; const dif = g.goal - t.k;
                    const r = document.getElementById('ring-bg');
                    if(dif<0) { r.classList.add('danger'); document.getElementById('l-restan').innerText="EXCESO"; document.getElementById('v-rem').innerText=Math.abs(Math.round(dif)); r.style.background=`conic-gradient(var(--bad) 0% 100%, var(--bad) 100%)`; }
                    else { r.classList.remove('danger'); document.getElementById('l-restan').innerText="RESTAN"; document.getElementById('v-rem').innerText=Math.round(dif); const p=Math.min((t.k/g.goal)*100,100); r.style.background=`conic-gradient(var(--car) 0% ${p}%, rgba(255,255,255,0.05) 0%)`; }
                    const b=(k,v,m)=>document.getElementById('b-'+k).style.width=Math.min((v/m)*100,100)+'%'; b('p',t.p,g.p); b('c',t.c,g.c); b('f',t.f,g.f);
                    document.getElementById('v-p').innerText=`${Math.round(t.p)}/${g.p}`;
                    const f = document.getElementById('feed'); f.innerHTML='';
                    MEALS.forEach(m => {
                        const arr = App.S.day[m.k] || [];
                        let mk=0, mp=0, mc=0, mf=0, html='';
                        arr.forEach((i, idx) => {
                            mk+=i.k; mp+=i.p; mc+=i.c; mf+=i.f;
                            html += `<div class="item"><div class="i-info"><h4>${i.n}</h4><div class="i-det"><span class="i-pill">${i.q}${i.u}</span> <span>🔥 ${Math.round(i.k)}</span></div></div><div class="c-actions"><button class="act-btn cln" title="Mover" onclick="window.App.Logic.openCopy('${m.k}','copy',${idx})">❐</button><button class="act-btn" onclick="window.App.Logic.editItem('${m.k}',${idx})">✎</button><button class="act-btn del" onclick="window.App.Logic.delItem('${m.k}',${idx})">✕</button></div></div>`;
                        });
                        f.innerHTML += `<div class="card"><div class="c-head"><div class="c-left"><i class="fas ${m.i}"></i> ${m.n}</div><div class="c-right"><span class="k-badge">${Math.round(mk)} kcal</span><button class="tool-btn add" onclick="window.App.Logic.openAdd('${m.k}')">+</button><button class="tool-btn copy" onclick="window.App.Logic.openCopy('${m.k}','copy')"><i class="far fa-copy"></i></button><button class="tool-btn move" onclick="window.App.Logic.openCopy('${m.k}','move')"><i class="far fa-calendar"></i></button><button class="tool-btn del" onclick="window.App.Logic.wipeMeal('${m.k}')"><i class="far fa-trash-alt"></i></button></div></div><div>${html}</div></div>`;
                    });
                }
            },

            Sys: {
                init: async () => { try { await App.DB.lib(); if(App.S.uid) await App.Sys.load(App.S.uid); else { document.getElementById('loading-screen').style.display='none'; App.UI.openUsers(); } } catch(e){console.error(e)} },
                load: async (id) => { App.S.day={}; App.S.uid=id; localStorage.setItem('tid', id); App.S.u=await App.DB.getU(id); if(!App.S.u){App.UI.openUsers();return} App.Calc.bio(); await App.Sys.sync(); window.App.Logic.checkWeight(); document.getElementById('loading-screen').style.display='none'; },
                sync: async () => { App.S.day = await App.DB.getDay(App.S.d); App.Render.all(); }
            }
        };

        // GESTURES
        let ts=0;
        document.addEventListener('touchstart',e=>ts=e.changedTouches[0].screenX);
        document.addEventListener('touchend',e=>{if(e.changedTouches[0].screenX<ts-50)App.Logic.day(1);if(e.changedTouches[0].screenX>ts+50)App.Logic.day(-1)});

        if(document.readyState==='complete') App.Sys.init(); else window.addEventListener('load', App.Sys.init);
    </script>
</body>
</html>
